name: Publish website and Android APK

on:
  push:
    branches:
      - main
      - 'arena/1f55c2d5-3787752557885325677854522577'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: arcade-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Publish GitHub Pages site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Capacitor
        run: npm ci
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Sync web app into Android project
        run: npm run android:sync
      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../pixel-arcade-android.apk
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-arcade-android
          path: pixel-arcade-android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: Android APK — последняя сборка
          body: |
            Установочный APK мини-аркады с PAC-MAN, Змейкой, пасьянсом, сапёром и Block Blast.
            APK собран автоматически из исходного кода репозитория; это debug-сборка для прямой установки на Android.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: pixel-arcade-android.apk
